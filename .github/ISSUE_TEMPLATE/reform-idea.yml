name: Reform idea
description: Suggest a structural reform for Pakistan.
title: "Idea: "
labels: ["idea"]
body:
  - type: input
    id: what
    attributes:
      label: The idea in one sentence
      placeholder: Fund cheap metro fares with shop rent at stations.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Does something similar already work anywhere? (optional)
      placeholder: Hong Kong, Japan
  - type: textarea
    id: problem
    attributes:
      label: What problem in Pakistan does it fix?
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Links
      description: Any source on the problem or on where a similar idea has been tried. Primary sources are best.
  - type: checkboxes
    id: write
    attributes:
      label: Would you write it?
      options:
        - label: I would like to write this reform if it is accepted.
